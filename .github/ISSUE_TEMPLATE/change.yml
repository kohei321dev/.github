name: 変更・改善の相談
description: 機能、要求、仕様、設計、セキュリティ、運用、プロセスの変更や改善を相談します
title: "[Change]: "
body:
  - type: markdown
    attributes:
      value: |
        変更や改善の相談をIssueとして記録するためのフォームです。
        分かる範囲で入力してください。不足する詳細はplanning・実装前評価で補完します。
        secret、個人情報、private URL、raw logは入力しないでください。

  - type: dropdown
    id: change_type
    attributes:
      label: 変更区分
      options:
        - Product
        - Requirement
        - Specification
        - Architecture
        - Security
        - Process
        - Operation
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 誰が、何に困っていて、なぜ今扱う必要があるかを記載してください。
      placeholder: 現在の問題と影響を、観測できた事実と推測に分けて記載します。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期待する成果
      description: 実装方法ではなく、完了後に利用者または運用者が得られる状態を記載してください。
    validations:
      required: true

  - type: textarea
    id: evidence_and_links
    attributes:
      label: 根拠・関連情報（任意）
      description: 秘匿化した観測事実、関連文書、Issue、Pull Requestなど、分かっている情報を記載してください。
      placeholder: |
        - 観測した事実:
        - 関連文書:
        - 関連Issue・Pull Request:

  - type: textarea
    id: constraints_and_notes
    attributes:
      label: 制約・対象範囲・補足（任意）
      description: 制約、対象・対象外、依存関係、その他の補足が分かっている場合に記載してください。

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認
      options:
        - label: secret、個人情報、private URL、raw logを記載していません。
          required: true
        - label: このIssueの作成だけでは実装開始を承認したことにならないと理解しています。
          required: true

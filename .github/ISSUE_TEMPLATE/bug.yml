name: 不具合報告
description: 現行の要求または仕様と異なる動作を報告します
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        secret、個人情報、private URL、未加工の本番ログは入力しないでください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どの機能で何が起きているかを簡潔に記載してください。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 確認環境
      description: version、commit、browser、OS、対象環境など、秘密情報を含まない範囲で記載してください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 最小の再現手順を番号付きで記載してください。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 根拠
      description: 秘匿化したerror、スクリーンショット、関連test、関連Issueなどを記載してください。

  - type: textarea
    id: current_contract
    attributes:
      label: 現行要求・仕様との関係
      description: 関連する`docs/requirements.md`または`docs/specifications/`の節を記載してください。不明な場合は「未確認」と記載します。
    validations:
      required: true

  - type: dropdown
    id: docs_impact
    attributes:
      label: ドキュメント影響
      options:
        - NO_DOC_CHANGE
        - DOC_UPDATE_REQUIRED
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 修正後の検証方法
      description: 追加する回帰testや確認手順を記載してください。
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認
      options:
        - label: secret、個人情報、private URL、raw logを記載していません。
          required: true
        - label: 既存IssueとPull Requestに明らかな重複がないことを確認しました。
          required: true
